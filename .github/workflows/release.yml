name: Build and publish Windows release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build dependencies
        run: python -m pip install Pillow PyInstaller
      - name: Verify release tag
        shell: pwsh
        run: |
          $version = python -c "from version import APP_VERSION; print(APP_VERSION)"
          if ($env:GITHUB_REF_NAME -ne "v$version") {
            throw "Release tag $env:GITHUB_REF_NAME must match version.py (v$version)."
          }
      - name: Build executable
        run: >-
          python -m PyInstaller --noconfirm --clean --onefile --windowed
          --name Sightline
          --icon "${{ github.workspace }}\Neon Crosshair Customizer Icon.ico"
          --hidden-import PIL --hidden-import PIL.Image --hidden-import PIL.ImageTk
          --specpath build --distpath dist crosshair_studio.py
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          name: Sightline ${{ github.ref_name }}
          generate_release_notes: true
          files: dist/Sightline.exe
